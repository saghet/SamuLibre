[package]
name = "samulibre-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
samulibre-types = { path = "../samulibre-types" }
samulibre-patcher = { path = "../samulibre-patcher" }
samulibre-shield = { path = "../samulibre-shield" }
samulibre-scanner = { path = "../samulibre-scanner" }
samulibre-vpn = { path = "../samulibre-vpn" }
samulibre-watcher = { path = "../samulibre-watcher" }
samulibre-ai = { path = "../samulibre-ai" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
walkdir = "2.5"
sysinfo = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
