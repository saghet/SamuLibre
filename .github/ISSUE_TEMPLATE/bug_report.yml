name: "🐛 Bug Report"
description: "Report a bug or unexpected behavior in SamuLibre"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report an issue in SamuLibre!"
  - type: input
    id: os_version
    attributes:
      label: "Operating System Version"
      description: "e.g., Windows 11 Pro 23H2 (Build 22631.3880)"
      placeholder: "Windows 11 Build..."
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: "What happened?"
      description: "Describe the issue clearly."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "How can the maintainers reproduce this issue?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs / Output"
      description: "Please paste any console output or logs from data/app_error.log."
      render: shell
