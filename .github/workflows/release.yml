name: SamuLibre Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Binary (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release GUI & CLI
        run: cargo build --release -p samulibre-gui -p samulibre-cli

      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target/release/samulibre-gui.exe package/samulibre.exe
          Copy-Item target/release/samulibre-cli.exe package/samulibre-cli.exe
          Copy-Item target/release/samulibre-gui.exe samulibre.exe
          Copy-Item -Recurse -Force data package/data
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath samulibre-windows-x64.zip -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            samulibre-windows-x64.zip
            samulibre.exe

  build-linux:
    name: Build Linux x86_64 Packages (.deb / .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev tor tor-geoipdb iptables zenity dpkg-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Optimized Release GUI & CLI
        run: cargo build --release -p samulibre-gui -p samulibre-cli

      - name: Package Debian/Ubuntu (.deb)
        run: |
          chmod +x scripts/packaging/build_deb.sh
          ./scripts/packaging/build_deb.sh

      - name: Package Universal Portable Tarball (.tar.gz)
        run: |
          chmod +x scripts/packaging/package_tarball.sh
          ./scripts/packaging/package_tarball.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            target/samulibre_*.deb
            target/samulibre-*.tar.gz

  build-arch:
    name: Build Garuda / Arch Linux Package (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust webkit2gtk-4.1 gtk3 libayatana-appindicator tor iptables

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Pacman Package (makepkg as non-root)
        run: |
          useradd -m builder || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && git config --global --add safe.directory '$GITHUB_WORKSPACE' && bash scripts/packaging/build_arch.sh"

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-release
          path: target/*.pkg.tar.zst

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-linux, build-arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare Assets for Release
        run: |
          mkdir -p release_assets
          cp windows-release/* release_assets/ || true
          cp linux-release/* release_assets/ || true
          cp arch-release/* release_assets/ || true
          ls -la release_assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: "SamuLibre ${{ github.ref_name }} - Native Multi-Platform Security Suite (Windows & Linux)"
          body: |
            ## 🛡️ SamuLibre Release ${{ github.ref_name }} (Windows, Ubuntu, Red Hat & Garuda Linux)
            
            ### Cross-Platform Security Innovations:
            - **Native Desktop GUI**: Apple-inspired glassmorphism dark theme for Windows 11/10 and Linux (GNOME / KDE Plasma 6 Wayland / XFCE).
            - **Linux Distro Native Support**: Tested & ready for **Ubuntu** (22.04/24.04), **Red Hat** (RHEL 9 / Fedora), and **Garuda Linux** (Arch/Plasma 6).
            - **Autonomous 0-Day Virtual Patcher**: Active live mitigations for unpatched CVEs on Windows and Linux kernel sysctl hardening (`fs.protected_regular`, `kernel.unprivileged_userns_clone`, `kernel.kptr_restrict`, `kernel.yama.ptrace_scope`).
            - **Endpoint Shield & Anti-Ransomware Canaries**: Zero-overhead tripwires, memory dump protection (`/proc/*/mem`, LSASS), and browser credential shield.
            - **Double-Cipher Tor VPN with Real-Time Latency**: Double onion hop routing, live ping updates, and network Kill-Switch.
            - **Zero Telemetry & Sub-40MB RAM**: Powered 100% in Rust with Windows EcoQoS and Linux `malloc_trim(0)`.
            
            ### Installation:
            - **Windows**: Download `samulibre-windows-x64.zip`, extract, and launch `samulibre.exe`.
            - **Ubuntu / Debian**: `sudo apt install ./samulibre_<version>_amd64.deb`
            - **Garuda / Arch / Manjaro**: `sudo pacman -U samulibre-<version>-1-x86_64.pkg.tar.zst`
            - **Red Hat / Fedora / Other Linux**: Download `samulibre-<version>-linux-x86_64.tar.gz`, extract, and run `sudo ./install.sh`.
          draft: false
          prerelease: false
