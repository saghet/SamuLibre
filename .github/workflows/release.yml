name: Release - Empaquetado & Hashes SHA-256

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    name: Compilar Artefactos Windows (Release)
    runs-on: windows-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Binarios Release
        run: cargo build --release -p samulibre-gui -p samulibre-cli

      - name: Empaquetar y Generar Checksums SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/samulibre-gui.exe dist/SamuLibre-GUI.exe
          Copy-Item target/release/samulibre-cli.exe dist/samulibre.exe
          Copy-Item -Recurse data dist/data
          Compress-Archive -Path dist/* -DestinationPath SamuLibre-Windows-x64.zip
          Get-FileHash -Algorithm SHA256 SamuLibre-Windows-x64.zip | Out-File -FilePath SHA256SUMS.txt

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SamuLibre-Windows-x64.zip
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
