name: CI - Integración Continua

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Pruebas Unitarias e Integración
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Toolchain de Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache de Dependencias Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Instalar Dependencias del Sistema en Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev build-essential

      - name: Verificar Formato del Código
        run: cargo fmt --all -- --check

      - name: Ejecutar Clippy (Linter)
        run: cargo clippy --workspace --all-targets -- -A clippy::invisible_characters

      - name: Ejecutar Suite Completa de Tests
        run: cargo test --workspace --verbose
