[workspace]
members = [
    "crates/samulibre-types",
    "crates/samulibre-patcher",
    "crates/samulibre-shield",
    "crates/samulibre-scanner",
    "crates/samulibre-vpn",
    "crates/samulibre-core",
    "crates/samulibre-cli",
    "crates/samulibre-gui",
    "crates/samulibre-watcher",
    "crates/samulibre-ai",
    "crates/samulibre-android",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["SamuLibre Security Community <dev@samulibre.org>"]
license = "GPL-3.0-or-later"
description = "Antivirus SamuLibre: Open-Source Antivirus, EDR, Virtual Patcher & Privacy Suite"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
sysinfo = "0.31"
notify = "6.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
